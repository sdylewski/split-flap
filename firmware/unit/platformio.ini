; Split-flap display - flap unit (Arduino Nano, ATmega328P)
;
;   pio run -e nano -t upload          Nano with the new bootloader (Optiboot) - most boards since 2018
;   pio run -e nano_old -t upload      Nano with the old bootloader ("ATmega328P (Old Bootloader)" in the IDE)
;   pio device monitor                 unit log + bench commands (type 'help')
;
; Not sure which bootloader? Try `nano` first; if the upload times out ("not in sync"), use `nano_old`.

[env]
platform = atmelavr@5.1.0
framework = arduino
monitor_speed = 115200
build_flags = -I../shared -Wall -Wextra
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

[env:nano]
board = nanoatmega328new
; The watchdog restarts a hung unit. Only safe with Optiboot: the old bootloader can't handle a
; watchdog reset and loops until power-cycled.
build_flags = ${env.build_flags} -DWATCHDOG_ENABLE=1 -DOPTIBOOT=1

[env:nano_old]
board = nanoatmega328
build_flags = ${env.build_flags} -DWATCHDOG_ENABLE=0 -DOPTIBOOT=0
