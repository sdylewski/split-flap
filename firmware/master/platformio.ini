; Split-flap display - master controller (original ESP32 dev board)
;
;   pio run                      build
;   pio run -t upload            flash firmware over USB
;   pio run -t uploadfs          flash the web UI (web/, gzipped) over USB
;   pio run -e ota -t upload     flash firmware over WiFi (flappy.local)
;   pio device monitor           serial log + console (type 'help')
;   pio test -e native           run the host unit tests
;
; Every version is pinned so a build next year produces the same firmware.

[platformio]
default_envs = esp32
data_dir = .pio/data   ; generated from web/ by tools/build_web.py (gzipped)

[env:esp32]
; pioarduino = community ESP32 platform with Arduino core 3.x (core 3.3.12, ESP-IDF 5.5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; 2 x 1.9 MB app slots (OTA) + 128 KB LittleFS
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
extra_scripts = pre:tools/build_web.py
build_flags =
  -I../shared
  -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter
lib_deps =
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
  bblanchon/ArduinoJson@7.4.3

; Over-the-air upload: same build, sent to the running display over WiFi
[env:ota]
extends = env:esp32
upload_protocol = espota
upload_port = flappy.local
upload_flags =
  --port=3232
  --auth=${sysenv.FLAPPY_OTA_PASSWORD}

; Host tests for the pure logic (text layout, letters, quiet hours). No board needed.
[env:native]
platform = native
build_flags = -std=gnu++17 -I../shared -Isrc
test_build_src = no
extra_scripts = post:tools/macos_sign.py
lib_compat_mode = off
